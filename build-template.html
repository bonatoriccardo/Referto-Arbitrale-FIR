<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Generatore template FIR</title>

  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <style>
    body {
      max-width: 720px;
      margin: 50px auto;
      padding: 20px;
      color: #14263a;
      font-family: system-ui, sans-serif;
      background: #f4f7fa;
    }

    main {
      padding: 28px;
      background: white;
      border: 1px solid #d4e1ec;
      border-radius: 14px;
      box-shadow: 0 8px 25px #003b7a18;
    }

    h1 {
      color: #003b7a;
    }

    button {
      padding: 13px 20px;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: #0878be;
      border: 0;
      border-radius: 8px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    #status {
      min-height: 24px;
      margin-top: 18px;
      font-weight: 650;
      white-space: pre-line;
    }

    code {
      padding: 2px 5px;
      background: #eaf4fb;
      border-radius: 4px;
    }
  </style>
</head>

<body>
<main>
  <h1>Template compilabile FIR</h1>

  <p>
    Converte <code>referto-base.pdf</code> in
    <code>referto-compilabile.pdf</code>.
  </p>

  <button id="build" type="button">
    Genera template compilabile
  </button>

  <p id="status"></p>
</main>

<script>
(() => {
  "use strict";

  const button = document.querySelector("#build");
  const status = document.querySelector("#status");

  function download(bytes, fileName) {
    const blob = new Blob([bytes], {
      type: "application/pdf"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = fileName;
    link.style.display = "none";

    document.body.appendChild(link);
    link.click();

    setTimeout(() => {
      link.remove();
      URL.revokeObjectURL(url);
    }, 2000);
  }

  async function buildTemplate() {
    button.disabled = true;
    status.style.color = "#17633a";
    status.textContent = "Creazione del template in corso…";

    try {
      if (!window.PDFLib) {
        throw new Error("PDF-lib non è disponibile.");
      }

      const response = await fetch(
        "referto-base.pdf?v=2",
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error(
          "referto-base.pdf non è stato trovato nella root."
        );
      }

      const {
        PDFDocument,
        StandardFonts,
        rgb
      } = window.PDFLib;

      const sourceBytes = await response.arrayBuffer();
      const pdf = await PDFDocument.load(sourceBytes);

      if (pdf.getPageCount() !== 6) {
        throw new Error(
          `Il PDF deve avere 6 pagine; trovate: ${pdf.getPageCount()}.`
        );
      }

      const form = pdf.getForm();

      const font = await pdf.embedFont(
        StandardFonts.Helvetica
      );

      const white = rgb(1, 1, 1);
      const black = rgb(0, 0, 0);

      const createdFields = [];

      function getPage(pageNumber) {
        return pdf.getPage(pageNumber - 1);
      }

      function toPdfY(page, top, height) {
        return page.getHeight() - top - height;
      }

      function erase(page, x, top, width, height) {
        page.drawRectangle({
          x,
          y: toPdfY(page, top, height),
          width,
          height,
          color: white
        });
      }

      function addTextField(
        pageNumber,
        name,
        x,
        top,
        width,
        height,
        options = {}
      ) {
        const page = getPage(pageNumber);

        erase(page, x, top, width, height);

        const field = form.createTextField(name);

        if (options.multiline) {
          field.enableMultiline();
        }

        /*
         * Prima si aggiunge il campo alla pagina.
         * Questo crea la default appearance /DA.
         */
        field.addToPage(page, {
          x,
          y: toPdfY(page, top, height),
          width,
          height,
          borderWidth: 0,
          backgroundColor: white,
          textColor: black,
          font
        });

        /*
         * Solo dopo addToPage è sicuro impostare la dimensione.
         */
        field.setFontSize(options.fontSize || 8);
        field.updateAppearances(font);

        createdFields.push(name);
      }

      function addCheckbox(
        pageNumber,
        name,
        x,
        top,
        size = 12
      ) {
        const page = getPage(pageNumber);
        const field = form.createCheckBox(name);

        field.addToPage(page, {
          x,
          y: toPdfY(page, top, size),
          width: size,
          height: size,
          borderWidth: 0
        });

        createdFields.push(name);
      }

      /*
       * PAGINA 1 — MAIL
       */

      [
        ["sender.fullName", 66, 83, 190, 13, 8],
        ["sender.email", 66, 98, 190, 13, 7],
        ["sender.phone", 66, 112, 190, 13, 8],
        ["sender.card", 66, 140, 190, 14, 8],

        ["committee.name", 300, 83, 205, 13, 7],
        ["committee.address", 300, 98, 205, 13, 7],
        ["committee.city", 300, 112, 205, 13, 8],
        ["committee.phone", 300, 127, 205, 13, 8],
        ["committee.email", 300, 140, 205, 14, 7],

        ["mail.pageCount", 354, 250, 25, 14, 9],
        ["mail.refereePhone", 136, 279, 90, 15, 9],
        ["match.date", 339, 279, 115, 15, 9],
        ["match.description", 112, 309, 391, 15, 8]
      ].forEach(field => {
        addTextField(1, ...field);
      });

      addCheckbox(
        1,
        "attachments.concussion",
        52,
        350
      );

      const attachmentNames = [
        "A",
        "B",
        "C",
        "C1",
        "D",
        "DAA",
        "F",
        "DAE",
        "DOC"
      ];

      attachmentNames.forEach((name, index) => {
        addTextField(
          1,
          `attachments.${name}`,
          113 + index * 40.5,
          424,
          28,
          17,
          { fontSize: 9 }
        );
      });

      addTextField(
        1,
        "mail.notes",
        66,
        600,
        391,
        100,
        {
          fontSize: 8,
          multiline: true
        }
      );

      /*
       * PAGINA 2 — CARTELLINO / MOD. F
       */

      [
        { half: 1, top: 60 },
        { half: 2, top: 389 }
      ].forEach(({ half, top }) => {
        [
          [
            `modF.${half}.home`,
            317, top, 68, 16, 7
          ],
          [
            `modF.${half}.away`,
            452, top, 68, 16, 7
          ],
          [
            `modF.${half}.category`,
            188, top + 21, 98, 17, 7
          ],
          [
            `modF.${half}.date`,
            86, top + 59, 86, 16, 8
          ],
          [
            `modF.${half}.start`,
            94, top + 88, 66, 16, 8
          ],
          [
            `modF.${half}.end`,
            190, top + 88, 66, 16, 8
          ]
        ].forEach(field => {
          addTextField(2, ...field);
        });

        ["home", "away"].forEach(team => {
          const x = team === "home" ? 244 : 378;

          for (let row = 0; row < 5; row += 1) {
            addTextField(
              2,
              `modF.${half}.temporary.${team}.${row}`,
              x,
              top + 40 + row * 14,
              129,
              13,
              { fontSize: 6 }
            );
          }

          for (let row = 0; row < 7; row += 1) {
            addTextField(
              2,
              `modF.${half}.permanent.${team}.${row}`,
              x,
              top + 207 + row * 14,
              129,
              13,
              { fontSize: 6 }
            );
          }
        });
      });

      [
        ["modF.referee", 147, 657, 156, 18, 8],
        ["modF.card", 183, 686, 85, 16, 8],
        ["modF.signature", 303, 758, 155, 18, 8]
      ].forEach(field => {
        addTextField(2, ...field);
      });

      /*
       * PAGINA 3 — MOD. A
       */

      [
        ["modA.date", 420, 59, 75, 17, 9],
        ["modA.time", 438, 88, 60, 17, 9],
        ["modA.category", 132, 117, 90, 18, 8],
        ["modA.location", 286, 117, 110, 18, 8],
        ["modA.field", 449, 117, 90, 18, 8],

        ["official.referee.name", 104, 139, 290, 18, 9],
        ["official.referee.card", 474, 139, 65, 18, 9],

        ["official.assistant1.name", 104, 154, 290, 16, 8],
        ["official.assistant1.card", 474, 154, 65, 16, 8],

        ["official.assistant2.name", 104, 169, 290, 16, 8],
        ["official.assistant2.card", 474, 169, 65, 16, 8],

        ["time.first.start", 112, 198, 42, 16, 8],
        ["time.first.end", 162, 198, 42, 16, 8],
        ["time.second.start", 276, 198, 42, 16, 8],
        ["time.second.end", 325, 198, 42, 16, 8],
        ["time.leftField", 420, 198, 115, 16, 8],

        ["team.home.name", 84, 219, 130, 20, 8],
        ["team.away.name", 313, 219, 130, 20, 8],

        ["team.home.score", 245, 219, 28, 20, 11],
        ["team.away.score", 474, 219, 28, 20, 11]
      ].forEach(field => {
        addTextField(3, ...field);
      });

      const scoringTypes = [
        "try",
        "conversion",
        "penalty",
        "drop"
      ];

      const homeColumns = [166, 200, 232, 262];
      const awayColumns = [395, 429, 461, 491];

      scoringTypes.forEach((type, index) => {
        [
          ["1", 257],
          ["2", 272],
          ["total", 286],
          ["points", 315]
        ].forEach(([period, top]) => {
          addTextField(
            3,
            `score.home.${period}.${type}`,
            homeColumns[index],
            top,
            20,
            14,
            { fontSize: 7 }
          );

          addTextField(
            3,
            `score.away.${period}.${type}`,
            awayColumns[index],
            top,
            20,
            14,
            { fontSize: 7 }
          );
        });
      });

      ["home", "away"].forEach(team => {
        const x = team === "home" ? 56 : 284;

        for (let row = 0; row < 8; row += 1) {
          const top = 384 + row * 14;

          [
            ["outNumber", x, 20],
            ["out", x + 22, 75],
            ["inNumber", x + 100, 15],
            ["in", x + 116, 75],
            ["time", x + 194, 28]
          ].forEach(([property, fieldX, width]) => {
            addTextField(
              3,
              `temporary.${team}.${row}.${property}`,
              fieldX,
              top,
              width,
              12,
              { fontSize: 6 }
            );
          });
        }
      });

      [
        ["yellow", 205, 567],
        ["red", 365, 567],
        ["absence", 205, 582],
        ["abnormal", 365, 582],
        ["injuries", 502, 582],
        ["facilities", 205, 596],
        ["incidents", 365, 596]
      ].forEach(([name, x, top]) => {
        addCheckbox(
          3,
          `flags.${name}`,
          x,
          top
        );
      });

      addTextField(
        3,
        "modA.signature",
        390,
        689,
        120,
        18,
        { fontSize: 8 }
      );

      /*
       * PAGINA 4 — MOD. C
       */

      function addDisciplinaryRows(
        prefix,
        firstTop,
        rowCount
      ) {
        for (let row = 0; row < rowCount; row += 1) {
          const top = firstTop + row * 13;

          [
            ["team", 56, 23],
            ["person", 88, 218],
            ["number", 318, 30],
            ["card", 359, 45],
            ["half", 411, 35],
            ["minute", 460, 35]
          ].forEach(([property, x, width]) => {
            addTextField(
              4,
              `${prefix}.${row}.${property}`,
              x,
              top,
              width,
              12,
              { fontSize: 7 }
            );
          });
        }
      }

      addDisciplinaryRows(
        "discipline.yellow",
        104,
        8
      );

      addDisciplinaryRows(
        "discipline.secondYellow",
        244,
        4
      );

      addDisciplinaryRows(
        "discipline.red",
        341,
        4
      );

      for (let row = 0; row < 4; row += 1) {
        addTextField(
          4,
          `discipline.red.${row}.reason`,
          55,
          425 + row * 76,
          425,
          55,
          {
            fontSize: 7,
            multiline: true
          }
        );
      }

      [
        ["modC.date", 201, 722, 125, 16, 8],
        ["modC.home", 127, 759, 95, 17, 7],
        ["modC.away", 226, 759, 95, 17, 7],
        ["modC.signature", 378, 765, 105, 16, 7]
      ].forEach(field => {
        addTextField(4, ...field);
      });

      /*
       * PAGINA 5 — MOD. C1
       */

      const memberTops = [
        86,
        174,
        262,
        350,
        438,
        526,
        614,
        702
      ];

      memberTops.forEach((top, row) => {
        [
          ["team", 53, 28],
          ["person", 84, 255],
          ["card", 342, 55],
          ["half", 400, 50],
          ["minute", 453, 50]
        ].forEach(([property, x, width]) => {
          addTextField(
            5,
            `members.${row}.${property}`,
            x,
            top,
            width,
            18,
            { fontSize: 7 }
          );
        });

        /*
         * L’ultimo blocco del modello termina prima del piè di pagina.
         */
        const reasonHeight =
          row === memberTops.length - 1
            ? 16
            : 55;

        addTextField(
          5,
          `members.${row}.reason`,
          53,
          top + 22,
          450,
          reasonHeight,
          {
            fontSize: 7,
            multiline: true
          }
        );
      });

      [
        ["modC1.date", 197, 723, 125, 16, 8],
        ["modC1.home", 125, 760, 95, 17, 7],
        ["modC1.away", 224, 760, 95, 17, 7],
        ["modC1.signature", 378, 765, 105, 16, 7]
      ].forEach(field => {
        addTextField(5, ...field);
      });

      /*
       * PAGINA 6 — MOD. D
       */

      addTextField(
        6,
        "modD.match",
        122,
        55,
        300,
        17,
        { fontSize: 8 }
      );

      addTextField(
        6,
        "modD.date",
        463,
        55,
        72,
        17,
        { fontSize: 8 }
      );

      [
        ["doctorYes", 402, 89],
        ["doctorNo", 485, 89],
        ["escortsYes", 402, 106],
        ["escortsNo", 485, 106],
        ["managerNormal", 402, 123],
        ["managerBad", 485, 123],
        ["crowdGood", 402, 140],
        ["crowdBad", 485, 140],
        ["securityDone", 402, 158],
        ["securityMissing", 402, 175],
        ["securityNone", 402, 192],
        ["facilitiesNo", 402, 209],
        ["facilitiesYes", 485, 209],
        ["injuriesNo", 402, 226],
        ["injuriesYes", 485, 226],
        ["incidentBefore", 228, 244],
        ["incidentDuring", 359, 244],
        ["incidentAfter", 452, 244]
      ].forEach(([name, x, top]) => {
        addCheckbox(
          6,
          `modD.${name}`,
          x,
          top
        );
      });

      addTextField(
        6,
        "modD.details",
        53,
        275,
        480,
        400,
        {
          fontSize: 8,
          multiline: true
        }
      );

      addTextField(
        6,
        "modD.signature",
        360,
        723,
        130,
        18,
        { fontSize: 8 }
      );

      /*
       * Aggiornamento finale di tutte le apparenze.
       */
      form.updateFieldAppearances(font);

      const output = await pdf.save();

      download(
        output,
        "referto-compilabile.pdf"
      );

      status.textContent =
        `Template creato correttamente con ` +
        `${createdFields.length} campi.\n` +
        `Carica referto-compilabile.pdf nella root del repository.`;

      status.style.color = "#17633a";
    } catch (error) {
      console.error(
        "Errore generazione AcroForm:",
        error
      );

      status.textContent =
        `Errore: ${error.message}`;

      status.style.color = "#b4232d";
    } finally {
      button.disabled = false;
    }
  }

  button.addEventListener(
    "click",
    buildTemplate
  );
})();
</script>
</body>
</html>
